<!DOCTYPE html>
<html lang="ko" class="light scroll-smooth">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6682864237624164" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="311s4klorBInl8fo1Dllf1GAdZAtMaM2Aemj4R_Ge-w">
    <meta name="description" content="2026 삿포로 마쓰리 가이드. 홋카이도 짧은 여름, 삿포로 맥주 가든과 요사코이 소란">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>">
    <title>삿포로 마쓰리 2026 완벽 가이드 | Japan City Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .app-gradient { background: linear-gradient(180deg,#ecfeff 0%,#ffffff 50%,#f0fdf4 100%); background-attachment: fixed; min-height: 100vh; }
        .dark .app-gradient { background: linear-gradient(180deg,#0f172a 0%,#020617 100%); }
        .glass-effect { background: rgba(255,255,255,0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.35); }
        .dark .glass-effect { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
        #mainHeader.scrolled { background-color: rgba(248,250,252,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); padding-top:.75rem; padding-bottom:.75rem; }
        .dark #mainHeader.scrolled { background-color: rgba(15,23,42,0.9); }

        /* ── Guide Modal ── */
        #guideModal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
            align-items: flex-end; justify-content: center;
            padding: 0;
        }
        #guideModal.open { display: flex; }
        #guideModalSheet {
            width: 100%; max-width: 680px; max-height: 92dvh;
            background: #fff; border-radius: 2rem 2rem 0 0;
            display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
            overflow: hidden;
        }
        #guideModal.open #guideModalSheet { transform: translateY(0); }
        .dark #guideModalSheet { background: #0f172a; }
        #guideModalBody { overflow-y: auto; flex: 1; padding: 0 24px 32px; }
        @media (min-width: 640px) {
            #guideModal { align-items: center; padding: 24px; }
            #guideModalSheet { border-radius: 2rem; max-height: 88dvh; }
        }
        .modal-section { margin-bottom: 20px; }
        .modal-label {
            font-size: 10px; font-weight: 900; letter-spacing: .15em;
            text-transform: uppercase; color: #94a3b8; margin-bottom: 10px;
        }
        .modal-spot { padding-left: 12px; border-left: 2px solid #e2e8f0; margin-bottom: 10px; }
        .dark .modal-spot { border-left-color: rgba(255,255,255,0.12); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 480px) { .modal-grid { grid-template-columns: 1fr; } }
        .modal-grid-cell { background: #f8fafc; border-radius: 1rem; padding: 14px 16px; }
        .dark .modal-grid-cell { background: rgba(255,255,255,0.06); }
        .modal-divider { border: none; border-top: 1.5px solid #f1f5f9; margin: 20px 0; }
        .dark .modal-divider { border-top-color: rgba(255,255,255,0.08); }
    </style>
</head>
<body class="app-gradient text-slate-950 dark:text-white transition-colors duration-500">

    <!-- Guide Modal -->
    <div id="guideModal" role="dialog" aria-modal="true" aria-labelledby="guideModalTitle">
        <div id="guideModalSheet">
            <!-- Drag handle -->
            <div style="padding:12px 0 4px;display:flex;justify-content:center;flex-shrink:0;">
                <div style="width:40px;height:4px;border-radius:9999px;background:#e2e8f0;"></div>
            </div>
            <!-- Modal header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:16px 24px 16px;flex-shrink:0;">
                <div>
                    <p id="guideModalMeta" style="font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#94a3b8;margin-bottom:4px;"></p>
                    <h2 id="guideModalTitle" style="font-size:1.4rem;font-weight:900;color:#0f172a;line-height:1.2;"></h2>
                </div>
                <button id="guideModalClose" onclick="closeGuideModal()" style="width:36px;height:36px;border-radius:50%;border:1.5px solid #f1f5f9;background:#f8fafc;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:12px;" aria-label="닫기">
                    <i class="fa-solid fa-xmark" style="color:#94a3b8;font-size:14px;"></i>
                </button>
            </div>
            <!-- Modal body (scrollable) -->
            <div id="guideModalBody"></div>
        </div>
    </div>

    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 px-6 transition-all duration-500">
        <nav class="mx-auto max-w-6xl py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 no-underline shrink-0">
                <span class="text-xl font-black tracking-tighter text-rose-400 uppercase">Japan City <span class="text-rose-500">Guide</span></span>
            </a>
            <div class="hidden md:flex items-center gap-2 text-[11px] font-black text-slate-400">
                <a href="/" class="hover:text-rose-500 transition-colors no-underline">Home</a>
                <span>›</span>
                <a href="sapporo" class="hover:text-rose-500 transition-colors no-underline">삿포로</a>
                <span>›</span>
                <span style="color:#0ea5e9">🎆 마쓰리</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex md:hidden items-center gap-1.5">
                    <a href="sapporo" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/30 dark:bg-white/5 border border-white/40 text-base no-underline" title="삿포로">❄️</a>
                </div>
                <button id="themeToggle" class="size-11 rounded-full border border-slate-200 dark:border-white/10 bg-white/30 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 flex items-center justify-center transition-all duration-300 shadow-sm active:scale-90">
                    <i id="themeIcon" class="fa-solid fa-moon text-indigo-600 dark:text-yellow-300 text-lg"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero -->
    <main class="relative z-10 pt-48 pb-16 px-6 text-center max-w-3xl mx-auto">
        <div class="text-6xl mb-5">❄️</div>
        <div class="inline-flex items-center gap-2 glass-effect px-5 py-2 rounded-full mb-6 shadow-sm">
            <span class="text-2xl">🎆</span>
            <span class="text-[10px] font-black tracking-[0.3em] uppercase" style="color:#0ea5e9">Matsuri Guide · 札幌</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-[900] tracking-tight mb-4 text-slate-900 dark:text-white">
            삿포로 <span style="color:#0ea5e9">마쓰리</span>
            <span class="block text-xl md:text-2xl font-black mt-2 text-slate-400 dark:text-slate-500">2026 완벽 가이드</span>
        </h1>
        <p class="text-base text-slate-500 dark:text-slate-400 font-bold leading-relaxed max-w-xl mx-auto mt-5">홋카이도 짧은 여름, 삿포로 맥주 가든과 요사코이 소란</p>
    </main>

    <!-- Cards -->
    <section class="relative z-10 px-6 pb-20 max-w-4xl mx-auto">
        <div id="cards" class="space-y-5"></div>
    </section>

    <!-- Counterpart CTA -->
    <section class="relative z-10 px-6 pb-32 max-w-4xl mx-auto">
        <a href="hanabi_sapporo" class="flex items-center justify-between p-7 rounded-[2.5rem] bg-gradient-to-br from-slate-800 to-slate-900 text-white shadow-xl hover:scale-[1.01] transition-all group no-underline">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center text-3xl">🎇</div>
                <div>
                    <p class="font-black text-xl leading-tight">삿포로 하나비 가이드</p>
                    <p class="text-xs opacity-70 font-bold mt-1">札幌의 🎇 가이드도 확인해보세요</p>
                </div>
            </div>
            <i class="fa-solid fa-arrow-right group-hover:translate-x-2 transition-transform text-2xl px-4 text-white/60"></i>
        </a>
    </section>

    <footer class="relative z-10 py-16 px-6 text-center border-t border-slate-200 dark:border-white/10">
        <p class="text-[10px] font-medium tracking-widest text-slate-400/60 dark:text-slate-500/50 mb-6 uppercase">&copy; 2026 Japan City Guide. All rights reserved.</p>
        <div class="flex gap-4 justify-center text-sm text-gray-400">
            <a href="/" class="hover:text-rose-500 transition-colors no-underline">Home</a>
            <a href="sapporo" class="hover:text-rose-500 transition-colors no-underline">삿포로</a>
            <a href="/privacy.html" class="hover:text-gray-600 no-underline">Privacy</a>
        </div>
    </footer>

    <script src="components.js"></script>
    <script>
        var PAGE_TYPE   = 'matsuri';
        var CITY_REGION = 'hokkaido';
        var REGION_META = {
            tokyo:    { color: 'sky',    image: 'https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?w=800&q=80' },
            osaka:    { color: 'rose',   image: 'https://images.unsplash.com/photo-1733693526658-a15f4c5ea7bb?w=800&q=80' },
            kyoto:    { color: 'violet', image: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&q=80' },
            hokkaido: { color: 'indigo', image: 'https://images.unsplash.com/photo-1693975264425-e6d639ea27c9?w=800&q=80' },
            kyushu:   { color: 'orange', image: 'https://images.unsplash.com/photo-1679230708086-2b10acf31074?w=800&q=80' },
            chubu:    { color: 'orange', image: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&q=80' },
        };
        var COLOR_HEX   = { sky: '#0ea5e9', rose: '#e11d48', violet: '#7c3aed', indigo: '#6366f1', orange: '#ea580c' };

        /* ── Modal ── */
        var guideModal      = document.getElementById('guideModal');
        var guideModalBody  = document.getElementById('guideModalBody');
        var guideModalTitle = document.getElementById('guideModalTitle');
        var guideModalMeta  = document.getElementById('guideModalMeta');

        function openGuideModal(guide, eventName, eventDate, themeColor) {
            guideModalTitle.textContent = eventName;
            guideModalMeta.textContent  = eventDate;
            guideModalMeta.style.color  = themeColor;

            var html = '';

            if (guide.summary) {
                html += '<p style="font-size:.85rem;font-weight:700;line-height:1.8;color:#64748b;margin-bottom:20px;">' + guide.summary + '</p>';
                html += '<hr class="modal-divider">';
            }

            if (guide.bestSpots && guide.bestSpots.length) {
                html += '<div class="modal-section">';
                html += '<p class="modal-label">📍 추천 관람 포인트</p>';
                guide.bestSpots.forEach(function(spot) {
                    html += '<div class="modal-spot">';
                    html += '<p style="font-size:.85rem;font-weight:800;color:#1e293b;margin-bottom:3px;">' + spot.name + '</p>';
                    html += '<p style="font-size:.8rem;font-weight:600;line-height:1.75;color:#64748b;">' + spot.desc + '</p>';
                    html += '</div>';
                });
                html += '</div>';
            }

            if (guide.tips && guide.tips.length) {
                html += '<hr class="modal-divider">';
                html += '<div class="modal-section">';
                html += '<p class="modal-label">💡 알아두면 좋은 팁</p>';
                html += '<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;">';
                guide.tips.forEach(function(tip) {
                    html += '<li style="display:flex;gap:9px;font-size:.8rem;font-weight:600;line-height:1.75;color:#64748b;">';
                    html += '<span style="color:' + themeColor + ';flex-shrink:0;margin-top:3px;font-size:.65rem;">▸</span>';
                    html += '<span>' + tip + '</span>';
                    html += '</li>';
                });
                html += '</ul></div>';
            }

            var gridItems = '';
            if (guide.crowd) {
                gridItems += '<div class="modal-grid-cell">';
                gridItems += '<p class="modal-label" style="margin-bottom:6px;">👥 혼잡도</p>';
                gridItems += '<p style="font-size:.8rem;font-weight:600;line-height:1.7;color:#64748b;">' + guide.crowd + '</p>';
                gridItems += '</div>';
            }
            if (guide.whatToWear) {
                gridItems += '<div class="modal-grid-cell">';
                gridItems += '<p class="modal-label" style="margin-bottom:6px;">👗 복장 추천</p>';
                gridItems += '<p style="font-size:.8rem;font-weight:600;line-height:1.7;color:#64748b;">' + guide.whatToWear + '</p>';
                gridItems += '</div>';
            }
            if (gridItems) {
                html += '<hr class="modal-divider">';
                html += '<div class="modal-section"><div class="modal-grid">' + gridItems + '</div></div>';
            }

            if (guide.food && guide.food.length) {
                html += '<hr class="modal-divider">';
                html += '<div class="modal-section">';
                html += '<p class="modal-label">🍜 주변 먹거리</p>';
                guide.food.forEach(function(f) {
                    html += '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;">';
                    html += '<span style="font-size:1.1rem;flex-shrink:0;margin-top:1px;">🥢</span>';
                    html += '<div>';
                    html += '<p style="font-size:.85rem;font-weight:800;color:#1e293b;margin-bottom:2px;">' + f.name + '</p>';
                    html += '<p style="font-size:.8rem;font-weight:600;line-height:1.7;color:#64748b;">' + f.desc + '</p>';
                    html += '</div></div>';
                });
                html += '</div>';
            }

            var footerItems = [];
            if (guide.budget) {
                footerItems.push('<span style="font-size:.8rem;font-weight:700;color:#94a3b8;">💰 ' + guide.budget + '</span>');
            }
            if (guide.officialUrl) {
                footerItems.push('<a href="' + guide.officialUrl + '" target="_blank" rel="noopener noreferrer" style="font-size:.8rem;font-weight:900;color:' + themeColor + ';text-decoration:none;display:inline-flex;align-items:center;gap:5px;">공식 사이트 <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:.65rem;"></i></a>');
            }
            if (footerItems.length) {
                html += '<hr class="modal-divider">';
                html += '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;">' + footerItems.join('') + '</div>';
            }

            guideModalBody.innerHTML = html;
            guideModalBody.scrollTop = 0;
            guideModal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeGuideModal() {
            guideModal.classList.remove('open');
            document.body.style.overflow = '';
        }

        guideModal.addEventListener('click', function(e) {
            if (e.target === guideModal) closeGuideModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeGuideModal();
        });

        /* ── Cards ── */
        async function initCards() {
            var container = document.getElementById('cards');
            try {
                var responses = await Promise.all([
                    fetch('src/data/matsuriData.json'),
                    fetch('src/data/matsuri_guide_detail.json')
                ]);
                var json       = await responses[0].json();
                var detailJson = await responses[1].json();
                var guides     = detailJson.guides || {};
                var region     = json.regions.find(function(r) { return r.id === CITY_REGION; });
                if (!region) return;
                var meta       = REGION_META[CITY_REGION];
                var themeColor = COLOR_HEX[meta.color] || '#0ea5e9';
                var items      = region[PAGE_TYPE];

                items.forEach(function(item, idx) {
                    var subtitle;
                    if (PAGE_TYPE === 'matsuri') {
                        subtitle = item.unescoHeritage ? '유네스코 무형문화유산' : (item.scale || '');
                    } else {
                        var shells = (item.scale && item.scale.shells) ? item.scale.shells : 0;
                        var freq   = item.scale && item.scale.frequency;
                        subtitle   = freq
                            ? (shells.toLocaleString() + '발 · ' + freq)
                            : ('약 ' + shells.toLocaleString() + '발');
                    }

                    var cardWrapper = document.createElement('div');
                    container.appendChild(cardWrapper);

                    var hasGuide = !!guides[item.id];
                    renderMatsuriCard(cardWrapper, {
                        region: region.id, regionLabel: region.name, regionEmoji: region.emoji,
                        color: meta.color,
                        rank: String(idx + 1).padStart(2, '0'),
                        subtitle: subtitle,
                        name: item.name, nameJP: item.nameJa,
                        date: item.date.label,
                        highlight: item.highlights[0] || '',
                        desc: item.highlights.join(' '),
                        tags: item.tags, city: item.venue.name,
                        image: meta.image,
                        link: '',
                    });

                    if (hasGuide) {
                        var footer = cardWrapper.querySelector('.mc-footer');
                        if (footer) {
                            var existingCta = footer.querySelector('.mc-cta');
                            if (existingCta) existingCta.remove();
                            var btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'mc-cta';
                            btn.style.background = themeColor;
                            btn.style.border = 'none';
                            btn.style.cursor = 'pointer';
                            btn.innerHTML = '가이드 보기&nbsp;<i class="fa-solid fa-arrow-right-long"></i>';
                            (function(g, name, date, color) {
                                btn.addEventListener('click', function() {
                                    openGuideModal(g, name, date, color);
                                });
                            })(guides[item.id], item.name, item.date.label, themeColor);
                            footer.appendChild(btn);
                        }
                    }
                });
            } catch(e) {
                console.error('데이터 로드 실패:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initCards);

        var themeToggle = document.getElementById('themeToggle');
        var themeIcon   = document.getElementById('themeIcon');
        var html        = document.documentElement;
        var header      = document.getElementById('mainHeader');

        window.addEventListener('scroll', function() {
            header.classList.toggle('scrolled', window.scrollY > 20);
        });
        function applyTheme(theme) {
            if (theme === 'dark') { html.classList.add('dark'); themeIcon.className = 'fa-solid fa-sun text-yellow-300 text-lg'; }
            else { html.classList.remove('dark'); themeIcon.className = 'fa-solid fa-moon text-indigo-600 text-lg'; }
        }
        themeToggle.onclick = function() {
            var t = html.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(t); localStorage.setItem('theme', t);
        };
        applyTheme(localStorage.getItem('theme') || 'light');
    </script>
</body>
</html>
